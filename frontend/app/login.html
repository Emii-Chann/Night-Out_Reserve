<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Night-Out Reserve</title>
    <link rel="icon" type="image/png" href="images/logo1.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css">

    <link rel="stylesheet" href="./styles/reg.css">
</head>

<body class="d-flex flex-column align-items-center justify-content-center min-vh-100">

    <div class="logo d-flex align-items-center gap-3 mb-4 text-white">
        <div class="logo-icon d-flex align-items-center justify-content-center rounded" style="background: #8b5cf6; width: 45px; height: 45px; font-size: 20px;">
            <a href="./index.html" class="text-white text-decoration-none">
                <i class="fa-regular fa-calendar-check"></i>
            </a>
        </div>
        <span class="fs-4 fw-bold">Night-Out Reserve</span>
    </div>
        
    <form id="loginForm" onsubmit="handleLogin(event)" class="d-flex flex-column gap-3">
        <h2 class="text-center fw-bold mb-3">Login</h2>

        <div>
            <input type="text" id="username" class="form-control bg-dark text-white border-secondary py-2" placeholder="Username or email">
            <div class="text-danger small mt-1 ps-1" id="userError"></div>
        </div>

        <div>
            <input type="password" id="password" class="form-control bg-dark text-white border-secondary py-2" placeholder="Password">
            <div class="text-danger small mt-1 ps-1" id="passError"></div>
        </div>

        <div class="d-flex flex-column gap-2 mt-2">
            <a href="./reg.html" class="text-decoration-none small" style="color: #a78bfa;">I don’t have an account</a>
            <a href="./forgot-password.html" class="text-decoration-none small" style="color: #a78bfa;">Forgot password?</a>
        </div>

        <button type="submit" class="btn text-white fw-bold py-2 mt-3 shadow-sm" style="background: linear-gradient(to right, #8b5cf6, #a78bfa); border: none;">Login</button>

        <p class="text-success text-center mb-0 mt-2" id="successMsg"></p>
    </form>

    <script src="scripts/login.js"></script>
    <script src="./scripts/cookie-consent.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
