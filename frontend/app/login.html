<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bejelentkezés</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

   
    <link rel="stylesheet" href="./styles/reg.css">
</head>

<body>

    
    <div class="logo">
        <div class="logo-icon">
            <i class="fa-regular fa-calendar-check"></i>
        </div>
        <span>Night-Out Reserve</span>
    </div>

    
    <form method="GET" onsubmit="return validateForm()">

        <h2>Bejelentkezés</h2>

        <input type="text" id="username" placeholder="Felhasználónév vagy Email">
        <div class="error" id="userError"></div>

        <input type="password" id="password" placeholder="Jelszó">
        <div class="error" id="passError"></div>

<button type="submit">Bejelentkezés</button>

<p class="success" id="successMsg"></p>
    </form>
    <script src="./scripts/regll.js"></script>
</body>
</html>
