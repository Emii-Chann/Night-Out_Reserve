<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Tables & Games</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            <h2>Night-Out Reserve</h2>
        </div>
        <nav class="sidebar-nav">
            <select id="venueSelector" class="admin-venue-select mb-3 ms-4 me-4 w-75 p-2 rounded border-0"></select>
            <a href="admin-dashboard.html" id="nav-dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="admin-helyszinek.html" id="nav-helyszinek"><i class="fa-solid fa-location-dot"></i> Locations</a>
            <a href="./set-password.html" class="nav-profile-link"><i class="fa fa-repeat"></i> Change Password</a>
            <a href="./admin-eszkozok.html" class="nav-profile-link active"><i class="fa fa-gamepad"></i> Tables & Games</a>
            <a href="./admin-profil.html" class="nav-profile-link"><i class="fa fa-user"></i> Profile</a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="kijelentkezes()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>

    <main class="admin-container">
        <div class="admin-header">
            <h1 class="fw-bold">Tables & Games</h1>
            <h2 id="aktualis-helyszin-neve" class="subtitle fs-4">Loading...</h2>
        </div>

        <div class="eszkozok-container m-0">
            <div class="eszkoz-oszlop" id="asztalok-lista">
                <h2 class="fs-4 mb-4"><i class="fas fa-chair text-primary"></i> My tables</h2>
                <div class="lista-tartalom" id="asztalok-grid"></div>
            </div>

            <div class="eszkoz-oszlop" id="jatekok-lista">
                <h2 class="fs-4 mb-4"><i class="fas fa-gamepad text-success"></i> My games</h2>
                <div class="lista-tartalom" id="jatekok-grid"></div>
            </div>
        </div>  
    </main>

    <div id="szerkesztEszkozModal" class="modal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary p-4">
                <h3 class="text-white border-bottom border-secondary pb-3 mb-4">Edit Equipment</h3>
                
                <input type="hidden" id="edit-id"> 
                <input type="hidden" id="edit-tipus"> 

                <div id="edit-asztalMezok">
                    <label class="form-label text-secondary small">Table number:</label>
                    <input type="number" id="edit-asztalSzam" class="form-control bg-dark text-white border-secondary mb-3">
                    
                    <label class="form-label text-secondary small">Capacity (persons):</label>
                    <input type="number" id="edit-asztalFerohely" class="form-control bg-dark text-white border-secondary mb-4">
                </div>

                <div id="edit-jatekMezok" style="display:none;">
                    <label class="form-label text-secondary small">Game name:</label>
                    <input type="text" id="edit-jatekNev" class="form-control bg-dark text-white border-secondary mb-3">
                    
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label class="form-label text-secondary small">Quantity:</label>
                            <input type="number" id="edit-jatekDarab" class="form-control bg-dark text-white border-secondary">
                        </div>
                        <div class="col-6">
                            <label class="form-label text-secondary small">Price/hour (HUF):</label>
                            <input type="number" id="edit-jatekAr" class="form-control bg-dark text-white border-secondary">
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button onclick="document.getElementById('szerkesztEszkozModal').style.display='none'" class="btn btn-outline-light w-50">Cancel</button>
                    <button onclick="mentesSzerkesztes()" class="admin-primary-btn m-0 w-50">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./scripts/admin-eszkozok.js"></script>
    <script src="./scripts/admin-dashboard.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
