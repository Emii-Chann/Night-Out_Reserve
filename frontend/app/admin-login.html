<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="./admin-dashboard.html">
                <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            </a>
            <span>Night-Out Reserve Admin</span>
        </div>
    </nav>

    <main class="admin-auth-wrapper">
        <section class="admin-auth-card">
            <h1>Admin login</h1>
            <p class="admin-auth-subtitle">Sign in to manage your venue with your Gmail account.</p>

            <form id="adminLoginForm">
                <label for="adminEmail">Gmail address</label>
                <input type="email" id="adminEmail" placeholder="tulajdonos@gmail.com" required>

                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" placeholder="Initial password" required>

                <button type="submit" class="admin-primary-btn">Login</button>
                <p id="adminLoginError" class="admin-error"></p>
            </form>
        </section>
    </main>

    <script src="./scripts/admin-auth.js"></script>
</body>
</html>
