<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body class="d-flex flex-column align-items-center justify-content-center min-vh-100">

    <div class="logo d-flex align-items-center gap-3 mb-4 text-white">
        <div class="logo-icon d-flex align-items-center justify-content-center rounded" style="background: #8b5cf6; width: 45px; height: 45px; font-size: 20px;">
            <a href="./index.html" class="text-white text-decoration-none">
                <i class="fa-regular fa-calendar-check"></i>
            </a>
        </div>
        <span class="fs-4 fw-bold">Night-Out Reserve Admin</span>
    </div>

    <section class="admin-auth-card" style="width: 100%; max-width: 450px;">
        <h1 class="fs-3 fw-bold text-center">Admin login</h1>
        <p class="admin-auth-subtitle text-center">Sign in to manage your venue with your Gmail account.</p>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label class="form-label text-secondary small">Gmail address</label>
                <input type="email" id="adminEmail" class="form-control bg-dark text-white border-secondary py-2" placeholder="tulajdonos@gmail.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-secondary small">Password</label>
                <input type="password" id="adminPassword" class="form-control bg-dark text-white border-secondary py-2" placeholder="Initial password" required>
            </div>

            <button type="submit" class="admin-primary-btn w-100 mt-2">Login</button>
            <p id="adminLoginError" class="admin-error text-center mt-2"></p>
        </form>
    </section>

    <script src="./scripts/admin-auth.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
