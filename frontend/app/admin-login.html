<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin bejelentkezés</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="./index.html">
                <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            </a>
            <span>Night-Out Reserve Admin</span>
        </div>
    </nav>

    <main class="admin-auth-wrapper">
        <section class="admin-auth-card">
            <h1>Admin bejelentkezés</h1>
            <p class="admin-auth-subtitle">Lépj be a helyszínkezelő felületre a Gmail címeddel.</p>

            <form id="adminLoginForm">
                <label for="adminEmail">Gmail cím</label>
                <input type="email" id="adminEmail" placeholder="tulajdonos@gmail.com" required>

                <label for="adminPassword">Jelszó</label>
                <input type="password" id="adminPassword" placeholder="Kezdeti jelszó" required>

                <button type="submit" class="admin-primary-btn">Belépés</button>
                <p id="adminLoginError" class="admin-error"></p>
            </form>
        </section>
    </main>

    <script src="./scripts/admin-auth.js"></script>
</body>
</html>
