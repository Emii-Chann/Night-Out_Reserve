<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Új admin jelszó beállítása</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="./index.html">
                <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            </a>
            <span>Night-Out Reserve Admin</span>
        </div>
    </nav>

    <main class="admin-auth-wrapper">
        <section class="admin-auth-card">
            <h1>Új jelszó beállítása</h1>
            <p class="admin-auth-subtitle">Első bejelentkezés után kérjük, állíts be saját jelszót.</p>

            <form id="setPasswordForm">
                <label for="newPassword">Új jelszó</label>
                <input type="password" id="newPassword" placeholder="Új jelszó" required>

                <label for="confirmNewPassword">Új jelszó megerősítése</label>
                <input type="password" id="confirmNewPassword" placeholder="Új jelszó újra" required>

                <button type="submit" class="admin-primary-btn">Kész</button>
                <p id="setPasswordError" class="admin-error"></p>
            </form>
        </section>
    </main>

    <script src="./scripts/admin-auth.js"></script>
</body>
</html>
