<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new admin password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>
  
     <div class="sidebar">
    <div class="sidebar-logo" style="display: flex; align-items: center; gap: 10px;">
        <div class="logo-icon">
            <i class="fa-regular fa-calendar-check"></i>
        </div>
        <h2 style="margin: 0;">Night-Out Reserve</h2>
        
    </div>

        <nav class="sidebar-nav">

            <select id="venueSelector" class="admin-venue-select"
                style="margin-right: 15px; padding: 5px; border-radius: 5px;">
            </select>
<nav>
            <a href="admin-dashboard.html" id="nav-dashboard">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="admin-helyszinek.html" id="nav-helyszinek">
                <i class="fa-solid fa-location-dot"></i> Locations
            </a>
            <a href="./set-password.html" class="nav-profile-link">
                <i class="fa fa-repeat" aria-hidden="true"></i> Change Password
            </a>
            <a href="./admin-eszkozok.html" class="nav-profile-link">
                <i class="fa fa-gamepad" aria-hidden="true"></i> Tables & Games
            </a>
            <a href="./admin-profil.html" class="nav-profile-link">
                <i class="fa fa-user" aria-hidden="true"></i> Profile
            </a>

            <span id="adminNameDisplay" style="margin-right: 15px; color: #eee;"></span>
        </nav>
        <div class="sidebar-footer">
            <button onclick="kijelentkezes()" class="btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <main class="admin-auth-wrapper">
        <section class="admin-auth-card">
            <h1>Set new password</h1>
            <p class="admin-auth-subtitle">After first login, set your own password.</p>

            <form id="setPasswordForm">
    <label for="oldPassword">Current (Temporary) password</label>
    <input type="password" id="oldPassword" placeholder="The password you received" required>

    <label for="newPassword">New password</label>
    <input type="password" id="newPassword" placeholder="New password" required>

    <label for="confirmNewPassword">Confirm password</label>
    <input type="password" id="confirmNewPassword" placeholder="New password again" required>

    <button type="submit" class="admin-primary-btn">Done</button>
    <p id="setPasswordError" class="admin-error"></p>
</form>
        </section>
    </main>

    <script src="./scripts/admin-auth.js"></script>
</body>
</html>
