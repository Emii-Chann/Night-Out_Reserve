<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set new admin password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>
  
     <div class="sidebar">
    <div class="sidebar-logo" style="display: flex; align-items: center; gap: 10px;">
        <div class="logo-icon">
            <i class="fa-regular fa-calendar-check"></i>
        </div>
        <h2 style="margin: 0;">Night-Out Reserve</h2>
        
    </div>

        <nav class="sidebar-nav">
    <select id="venueSelector" class="admin-venue-select mb-3 ms-4 me-4 w-75 p-2 rounded border-0"></select>
    <a href="admin-dashboard.html" id="nav-dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
    <a href="admin-helyszinek.html" id="nav-helyszinek"><i class="fa-solid fa-location-dot"></i> Locations</a>
    <a href="./set-password.html" class="active"><i class="fa fa-repeat"></i> Change Password</a>
    <a href="./admin-eszkozok.html"><i class="fa fa-gamepad"></i> Tables & Games</a>
    <a href="./admin-profil.html"><i class="fa fa-user"></i> Profile</a>
</nav>
        <div class="sidebar-footer">
            <button onclick="kijelentkezes()" class="btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    <main class="admin-auth-wrapper">
        <section class="admin-auth-card">
            <h1>Set new password</h1>
            <p class="admin-auth-subtitle">After first login, set your own password.</p>

            <form id="setPasswordForm">
    <label for="oldPassword">Current (Temporary) password</label>
    <input type="password" id="oldPassword" placeholder="The password you received" required>

    <label for="newPassword">New password</label>
    <input type="password" id="newPassword" placeholder="New password" required>

    <label for="confirmNewPassword">Confirm password</label>
    <input type="password" id="confirmNewPassword" placeholder="New password again" required>

    <button type="submit" class="admin-primary-btn">Done</button>
    <p id="setPasswordError" class="admin-error"></p>
</form>
        </section>
    </main>

    <script src="./scripts/admin-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
