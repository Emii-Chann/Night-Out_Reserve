<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night-Out Reserve</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
</head>
<body>

   <div id="navbar-container"></div>

    <header class="hero">
        <div class="hero-content">
            <h1>Te éjszakád, <span class="text-purple">Te utad</span></h1>
            <p>Foglalj exkluzív helyszíneket, VIP asztalokat és prémium játékokat a tökéletes éjszakai életért</p>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="">
                <button class="search-btn">Keresés</button>
            </div>

            <div class="category-tabs">
                <a href="./szorakozohely.html" class="tab ">Szórakozóhelyek</a>
                <a href="./asztalok.html" class="tab">Asztalok</a>
                <a href="./jatekok.html" class="tab active">Játékok</a>
            </div>
        </div>
    </header>

<div id="helyszinek-grid"></div>

<div id="foglalas-modal" style="display: none;" class="modal">
    <div class="modal-tartalom">
        <h2 id="modal-cim">Book Midnight Club</h2>
        
        <form id="jatek-foglalas-form">
            <label>Dátum</label>
            <input type="date" id="foglalas-datum" required>

            <label>Időpont</label>
            <input type="time" id="foglalas-ido" required>

            <label>Időtartam (óra)</label>
            <input type="number" id="foglalas-idotartam" value="1" min="1" required>

            <label>Játék</label>
            <select id="foglalas-jatek" required>
                </select>

            <label>Email</label>
            <input type="email" id="foglalas-email" required>

            <input type="hidden" id="foglalas-szorakozohely-id">

            <button type="button" onclick="foglalasBekuldese()">Folytatás a fizetéshez</button>
            <button type="button" onclick="modalBezarasa()">Mégsem</button>
        </form>
    </div>
</div>
    



</footer>
    <script src="./scripts/Night-Out Reserve.js"></script>
<script src="./scripts/jatekfoglalas.js"></script>
    <script src="./scripts/nav.js"></script>       
    <script src="./scripts/helyszinek.js"></script>
</body>
</html>
