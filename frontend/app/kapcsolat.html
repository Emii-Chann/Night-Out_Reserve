<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Night-Out Reserve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <style>
        .content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .contact-container {
            max-width: 1000px;
            width: 100%;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar px-4 py-3">
        <div class="logo">
            <a href="./index.html"><div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div></a>
            <span>Night-Out Reserve</span>
        </div>
    </nav>

    <div class="content-wrapper">
        <h2 class="text-center mb-5 fw-bold display-4">Get in Touch</h2>
        
        <div class="container contact-container">
            <div class="row g-4 justify-content-center align-items-stretch">
                
                <div class="col-md-5">
                    <div class="featured-card h-100 p-4 d-flex flex-column justify-content-center">
                        <h4 class="mb-4 fw-bold text-center text-md-start">Contact Info</h4>
                        <div class="d-flex flex-column gap-3">
                            <p class="mb-0"><i class="fas fa-envelope me-3 text-primary"></i> contact@nightout-reserve.com</p>
                            <p class="mb-0"><i class="fas fa-phone me-3 text-primary"></i> +36 70 987 6543</p>
                            <hr class="my-4" style="border-color: var(--border-color);">
                            <h5 class="mb-3 text-center text-md-start">Social Media</h5>
                            <div class="d-flex gap-4 fs-3 justify-content-center justify-content-md-start">
                                <a href="#" class="text-white text-decoration-none"><i class="fab fa-facebook hover-primary"></i></a>
                                <a href="#" class="text-white text-decoration-none"><i class="fab fa-instagram hover-primary"></i></a>
                                <a href="#" class="text-white text-decoration-none"><i class="fab fa-tiktok hover-primary"></i></a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="featured-card p-4">
                        <h4 class="mb-4 fw-bold">Send us a Message</h4>
                        <form>
                            <div class="mb-3">
                                <input type="text" class="form-control py-3" placeholder="Full Name" style="background: var(--input-bg); border: 1px solid var(--border-color); color: white;">
                            </div>
                            <div class="mb-3">
                                <input type="email" class="form-control py-3" placeholder="Email Address" style="background: var(--input-bg); border: 1px solid var(--border-color); color: white;">
                            </div>
                            <div class="mb-4">
                                <textarea class="form-control" rows="5" placeholder="How can we help you?" style="background: var(--input-bg); border: 1px solid var(--border-color); color: white;"></textarea>
                            </div>
                            <button type="submit" class="search-btn w-100 py-3">Send Message</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
