<!DOCTYPE html>
<html lang="hu">

<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <title>Admin - Helyszínek Kezelése</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">

</head>

<body>

     <div class="sidebar">
    <div class="sidebar-logo" style="display: flex; align-items: center; gap: 10px;">
        <div class="logo-icon">
            <i class="fa-regular fa-calendar-check"></i>
        </div>
        <h2 style="margin: 0;">Night-Out Reserve</h2>
        
    </div>

               <nav class="sidebar-nav">

            <select id="venueSelector" class="admin-venue-select"
                style="margin-right: 15px; padding: 5px; border-radius: 5px;">
            </select>
<nav>
            <a href="admin-dashboard.html" id="nav-dashboard">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="admin-helyszinek.html" id="nav-helyszinek">
                <i class="fa-solid fa-location-dot"></i> Locations
            </a>
            <a href="./set-password.html" class="nav-profile-link">
                <i class="fa fa-repeat" aria-hidden="true"></i> Change Password
            </a>
            <a href="./admin-eszkozok.html" class="nav-profile-link">
                <i class="fa fa-gamepad" aria-hidden="true"></i> Tables & Games
            </a>
            <a href="./admin-profil.html" class="nav-profile-link">
                <i class="fa fa-user" aria-hidden="true"></i> Profile
            </a>

            <span id="adminNameDisplay" style="margin-right: 15px; color: #eee;"></span>
        </nav>
        <div class="sidebar-footer">
            <button onclick="kijelentkezes()" class="btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </div>

    </div>

    <main class="admin-container" style="padding: 120px 20px;">
        <div class="admin-header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">


            <div class="admin-panel-kartya"
                style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto;">
            <h3 style="color: #bb86fc; margin-top: 0;">My Contact Information</h3>
            <p style="font-size: 14px; color: #ccc;">These details will be displayed to guests during the booking process.
            
            </p>

            <form id="tulaj-adat-form">
                <input type="hidden" id="tulaj-id" value="1">

                <label style="display: block; margin-top: 10px;">Contact Person</label>
                <input type="text" id="tulaj-nev" placeholder="E.g. John Doe"
                    style="width: 100%; padding: 8px; border-radius: 4px;" required>

                <label style="display: block; margin-top: 10px;">Email</label>
                <input type="email" id="tulaj-email" placeholder="email@example.com"
                    style="width: 100%; padding: 8px; border-radius: 4px;" required>

                <label style="display: block; margin-top: 10px;">Phone Number</label>
                <input type="text" id="tulaj-tel" placeholder="+36 30 123 4567"
                    style="width: 100%; padding: 8px; border-radius: 4px;" required>

                <button type="button" onclick="tulajAdatMentese()"
                    style="margin-top: 20px; width: 100%; padding: 10px; background-color: #bb86fc; color: black; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;">
                    Save / Update
                </button>
            </form>
        </div>

    </div>
    <script src="./scripts/admin-dashboard.js"></script>
</body>

</html>
