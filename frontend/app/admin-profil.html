<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Profile</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            <h2>Night-Out Reserve</h2>
        </div>
        <nav class="sidebar-nav">
            <select id="venueSelector" class="admin-venue-select mb-3 ms-4 me-4 w-75 p-2 rounded border-0"></select>
            <a href="admin-dashboard.html" id="nav-dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="admin-helyszinek.html" id="nav-helyszinek"><i class="fa-solid fa-location-dot"></i> Locations</a>
            <a href="./set-password.html" class="nav-profile-link"><i class="fa fa-repeat"></i> Change Password</a>
            <a href="./admin-eszkozok.html" class="nav-profile-link"><i class="fa fa-gamepad"></i> Tables & Games</a>
            <a href="./admin-profil.html" class="nav-profile-link active"><i class="fa fa-user"></i> Profile</a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="kijelentkezes()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>

    <main class="admin-container">
        <div class="admin-section mx-auto" style="max-width: 500px; margin-top: 50px;">
            <h3 style="color: #bb86fc; margin-top: 0;">My Contact Information</h3>
            <p class="text-secondary small mb-4">These details will be displayed to guests during the booking process.</p>

            <form id="tulaj-adat-form">
                <input type="hidden" id="tulaj-id" value="1">

                <div class="mb-3">
                    <label class="form-label text-secondary small">Contact Person</label>
                    <input type="text" id="tulaj-nev" class="form-control bg-dark text-white border-secondary" placeholder="E.g. John Doe" required>
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary small">Email</label>
                    <input type="email" id="tulaj-email" class="form-control bg-dark text-white border-secondary" placeholder="email@example.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small">Phone Number</label>
                    <input type="text" id="tulaj-tel" class="form-control bg-dark text-white border-secondary" placeholder="+36 30 123 4567" required>
                </div>

                <button type="button" onclick="tulajAdatMentese()" class="admin-primary-btn w-100">Save / Update</button>
            </form>
        </div>
    </main>

    <script src="./scripts/admin-dashboard.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
