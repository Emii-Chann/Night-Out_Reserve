<!DOCTYPE html>
<html lang="hu" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elfelejtett jelszó | Night-Out Reserve</title>
    <link rel="icon" type="image/png" href="images/logo1.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="./styles/reg.css">
</head>

<body class="d-flex flex-column align-items-center justify-content-center min-vh-100">

    <div class="logo d-flex align-items-center gap-3 mb-4 text-white">
        <div class="logo-icon d-flex align-items-center justify-content-center rounded" style="background: #8b5cf6; width: 45px; height: 45px; font-size: 20px;">
            <a href="./login.html" class="text-white text-decoration-none">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>
        <span class="fs-4 fw-bold">Back to login</span>
    </div>

    <form class="d-flex flex-column gap-3" onsubmit="event.preventDefault(); sendResetEmail();">
        <h3 class="text-center fw-bold mb-2">Forgot Password</h3>
        <p class="text-center text-secondary small mb-4">Enter your email address, and we will send you a link to reset your password.</p>
        
        <div>
            <input type="email" id="email" class="form-control bg-dark text-white border-secondary py-2" placeholder="Email address" required>
        </div>
        
        <button type="submit" class="btn text-white fw-bold py-2 mt-3 shadow-sm" style="background: linear-gradient(to right, #8b5cf6, #a78bfa); border: none;">Send Link</button>
        
        <div id="message" class="text-center mt-3 fw-bold small"></div>
    </form>

    <script>
        async function sendResetEmail() {
            const email = document.getElementById('email').value;
            const messageDiv = document.getElementById('message');
            
            if(!email) { 
                messageDiv.className = "text-danger text-center mt-3 fw-bold small";
                messageDiv.innerText = "Please enter your email address!"; 
                return; 
            }

            try {
                const response = await fetch('/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                if (response.ok) {
                    messageDiv.className = "text-success text-center mt-3 fw-bold small";
                    messageDiv.innerText = "Email sent! Please check your inbox.";
                } else {
                    messageDiv.className = "text-danger text-center mt-3 fw-bold small";
                    messageDiv.innerText = "An error occurred. Please check the email address.";
                }
            } catch (error) {
                messageDiv.className = "text-danger text-center mt-3 fw-bold small";
                messageDiv.innerText = "Failed to reach the server.";
            }
        }
    </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
