<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin reservation management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>

<body>
    
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            <h2>Night-Out</h2>

            <span>Admin Panel</span>
        </div>

        <nav class="sidebar-nav">

            <a href="admin-dashboard.html" id="nav-dashboard">
                <i class="fa-solid fa-chart-line"></i> Vezérlőpult
            </a>
            <a href="admin-helyszinek.html" id="nav-helyszinek">
                <i class="fa-solid fa-location-dot"></i> Helyszínek
            </a>
            <a href="./set-password.html" class="nav-profile-link">
                <i class="fa fa-repeat" aria-hidden="true"></i> Passwordchange</a>
            <a href="./admin-eszkozok.html" class="nav-profile-link">
                <i class="fa fa-gamepad" aria-hidden="true"></i> Eszközök</a>
            <a href="./admin-profil.html" class="nav-profile-link">
                <i class="fa fa-user" aria-hidden="true"></i> Profil</a>

            <span id="adminNameDisplay" style="margin-right: 15px; color: #eee;"></span>
        </nav>
        <div class="sidebar-footer">
            <button onclick="kijelentkezes()" class="btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Kijelentkezés
            </button>
        </div>
    </div>





    <main class="admin-dashboard">
        <header class="admin-dashboard-header">
            <h1>Manage reservations</h1>
            <p>Review incoming bookings and track accepted or rejected requests.</p>
        </header>

        <section class="admin-sections">
            <div class="admin-section">
                <h2>Incoming reservations</h2>
                <div id="incomingReservations" class="admin-reservation-list"></div>
            </div>

            <div class="admin-section">
                <h2>Accepted reservations</h2>
                <div id="acceptedReservations" class="admin-reservation-list"></div>
            </div>

            <div class="admin-section">
                <h2>Rejected reservations</h2>
                <div id="rejectedReservations" class="admin-reservation-list"></div>
            </div>
        </section>




    </main>

    <script src="./scripts/admin-dashboard.js"></script>
</body>

</html>
