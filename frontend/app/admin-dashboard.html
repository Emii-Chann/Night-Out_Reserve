<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin reservation management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <a href="./admin-dashboard.html">
                <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            </a>

            <select id="venueSelector" class="admin-venue-select"
                style="margin-right: 15px; padding: 5px; border-radius: 5px;">
            </select>

<button onclick="nyitEszkozModal()" class="admin-btn" style="background-color: #00b894; margin-left: 10px;">
    <i class="fa-solid fa-plus-circle"></i> Új Eszköz (Asztal/Játék)
</button>

<div id="ujEszkozModal" style="display: none; position: fixed; top: 15%; left: 50%; transform: translate(-50%, 0); background: #1e1e2f; padding: 25px; border-radius: 10px; border: 1px solid #00b894; z-index: 1001; width: 320px;">

    <h3 style="color: white; margin-top: 0;">Eszköz hozzáadása: <span id="aktualisHelyNev" style="color: #00b894;"></span></h3>

    <label style="color: #a29bfe;">Típus:</label>
    <select id="eszkozTipus" onchange="valtsEszkozMezoket()" style="width: 100%; margin-bottom: 15px; padding: 8px;">
        <option value="asztal">Asztal</option>
        <option value="jatek">Játék (Biliárd, Darts, stb.)</option>
    </select>

    <div id="asztalMezok">
        <label style="color: #a29bfe;">Asztal száma/neve:</label>
        <input type="text" id="asztalSzam" style="width: 100%; margin-bottom: 10px; padding: 8px;">
        
        <label style="color: #a29bfe;">Férőhely (fő):</label>
        <input type="number" id="asztalFerohely" style="width: 100%; margin-bottom: 15px; padding: 8px;">
    </div>

    <div id="jatekMezok" style="display: none;">
        <label style="color: #a29bfe;">Játék megnevezése:</label>
        <input type="text" id="jatekNev" style="width: 100%; margin-bottom: 10px; padding: 8px;">
        
        <label style="color: #a29bfe;">Leírás (Pl. 9 lábas, profi):</label>
        <input type="text" id="jatekLeiras" style="width: 100%; margin-bottom: 10px; padding: 8px;">

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label style="color: #a29bfe;">Darab:</label>
                <input type="number" id="jatekDarab" value="1" style="width: 100%; padding: 8px;">
            </div>
            <div style="flex: 1;">
                <label style="color: #a29bfe;">Ár/óra (Ft):</label>
                <input type="number" id="jatekAr" style="width: 100%; padding: 8px;">
            </div>
        </div>
    </div>

    <button onclick="mentesUjEszkoz()" class="admin-btn accept" style="width: 100%; margin-bottom: 10px;">Hozzáadás</button>
    <button onclick="document.getElementById('ujEszkozModal').style.display='none'" class="admin-btn reject" style="width: 100%;">Mégse</button>
</div>







            <span>Night-Out Reserve Admin</span>

            <span id="adminNameDisplay" style="margin-right: 15px; color: #eee;"></span>
            <a href="./set-password.html" class="nav-profile-link">Passwordchange</a>

            <button id="logoutBtn" class="admin-logout-btn">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </nav>

    <main class="admin-dashboard">
        <header class="admin-dashboard-header">
            <h1>Manage reservations</h1>
            <p>Review incoming bookings and track accepted or rejected requests.</p>
        </header>

        <section class="admin-sections">
            <div class="admin-section">
                <h2>Incoming reservations</h2>
                <div id="incomingReservations" class="admin-reservation-list"></div>
            </div>

            <div class="admin-section">
                <h2>Accepted reservations</h2>
                <div id="acceptedReservations" class="admin-reservation-list"></div>
            </div>

            <div class="admin-section">
                <h2>Rejected reservations</h2>
                <div id="rejectedReservations" class="admin-reservation-list"></div>
            </div>
        </section>
    </main>

    <script src="./scripts/admin-dashboard.js"></script>
</body>

</html>
