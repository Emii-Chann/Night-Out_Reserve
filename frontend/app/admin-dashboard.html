<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin reservation management</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>
    
    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            <h2>Night-Out Reserve</h2>
        </div>
        <nav class="sidebar-nav">
            <select id="venueSelector" class="admin-venue-select mb-3 ms-4 me-4 w-75 p-2 rounded border-0"></select>
            <a href="admin-dashboard.html" id="nav-dashboard" class="active"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="admin-helyszinek.html" id="nav-helyszinek"><i class="fa-solid fa-location-dot"></i> Locations</a>
            <a href="./set-password.html" class="nav-profile-link"><i class="fa fa-repeat"></i> Change Password</a>
            <a href="./admin-eszkozok.html" class="nav-profile-link"><i class="fa fa-gamepad"></i> Tables & Games</a>
            <a href="./admin-profil.html" class="nav-profile-link"><i class="fa fa-user"></i> Profile</a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="kijelentkezes()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>

    <main class="admin-dashboard">
        <header class="admin-dashboard-header">
            <h1>Manage reservations</h1>
            <p>Review incoming bookings and track accepted or rejected requests.</p>
        </header>

        <section class="row g-4 mt-2">
            <div class="col-lg-4">
                <div class="admin-section h-100 border-start border-warning border-3">
                    <h2 class="text-warning"><i class="fa-solid fa-clock"></i> Incoming reservations</h2>
                    <div id="incomingReservations" class="admin-reservation-list"></div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="admin-section h-100 border-start border-success border-3">
                    <h2 class="text-success"><i class="fa-solid fa-check"></i> Accepted reservations</h2>
                    <div id="acceptedReservations" class="admin-reservation-list"></div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="admin-section h-100 border-start border-danger border-3">
                    <h2 class="text-danger"><i class="fa-solid fa-xmark"></i> Rejected reservations</h2>
                    <div id="rejectedReservations" class="admin-reservation-list"></div>
                </div>
            </div>
        </section>
    </main>

    <script src="./scripts/admin-dashboard.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
