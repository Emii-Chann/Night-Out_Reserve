<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin foglaláskezelés</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="./index.html">
                <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            </a>
            <span>Night-Out Reserve Admin</span>
        </div>
    </nav>

    <main class="admin-dashboard">
        <header class="admin-dashboard-header">
            <h1>Foglalások kezelése</h1>
            <p>Kezeled a helyszínedre érkező bejövő foglalásokat, és áttekinted az elfogadott / elutasított kéréseket.</p>
        </header>

        <section class="admin-sections">
            <div class="admin-section">
                <h2>Bejövő foglalások</h2>
                <div id="incomingReservations" class="admin-reservation-list"></div>
            </div>

            <div class="admin-section">
                <h2>Elfogadott foglalások</h2>
                <div id="acceptedReservations" class="admin-reservation-list"></div>
            </div>

            <div class="admin-section">
                <h2>Elutasított foglalások</h2>
                <div id="rejectedReservations" class="admin-reservation-list"></div>
            </div>
        </section>
    </main>

    <script src="./scripts/admin-dashboard.js"></script>
</body>
</html>
