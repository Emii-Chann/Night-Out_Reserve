<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night-Out Reserve</title>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    
    <script>
        window.APP_CONFIG = {
            BACKEND_URL: "${BACKEND_BASE_URL}"
        };
        document.addEventListener("DOMContentLoaded", betoltHelyszinekreel);

        async function betoltHelyszinekreel() {
            try {
                const response = await fetch('https://nigth-out-reserve.org/api/helyszinek/list');
                const adatok = await response.json();

                const kontener = document.getElementById('helyszinek-gridreel');
                kontener.innerHTML = ""; 

                adatok.forEach(hely => {
                    kontener.innerHTML += `
                        <div class="featured-card shadow">
                            <h3 class="fw-bold mb-1">${hely.nev}</h3>
                            <p class="text-secondary mb-0">Venue</p>
                        </div>
                    `;
                });
            } catch (hiba) {
                console.error("Failed to load venues:", hiba);
            }
        }
    </script>
</head>
<body class="d-flex flex-column min-vh-100">

    <div id="navbar-container"></div>

    <header class="hero d-flex flex-column justify-content-center align-items-center text-center flex-grow-1 px-3">
        <div class="hero-content mt-5 pt-5">
            <h1 class="display-3 fw-bold mb-3">Your night, <span style="color: #8b5cf6;">your way</span></h1>
            <p class="lead text-secondary mb-5 mx-auto" style="max-width: 600px;">
                Book exclusive venues, VIP tables, and premium games for the perfect nightlife experience.
            </p>

            <div class="featured-carousel mb-5 overflow-hidden mx-auto" style="max-width: 900px;">
                <div class="featured-track d-flex gap-4 justify-content-center">
                    <div id="helyszinek-gridreel" class="d-flex gap-3"></div>
                </div>
            </div>

            <a href="./szorakozohely.html" class="hero-cta-btn btn rounded-pill px-5 py-3 fw-bold shadow-lg text-white" style="background-color: #8b5cf6; border: none; font-size: 1.1rem;">
                Let's get started
            </a>
        </div>
    </header>

    <footer class="footer mt-auto py-5" style="background-color: #2e2e42;">
        <div class="container">
            <div class="row g-4 text-center text-md-start">
                
                <div class="col-12 col-md-3">
                    <h5 class="fw-bold text-white mb-3">Night-Out Reserve</h5>
                    <p class="text-secondary small">Premium booking for nightlife and experiences.</p>
                </div>

                <div class="col-12 col-md-3 d-flex flex-column gap-2">
                    <h5 class="fw-bold text-white mb-3">Pages</h5>
                    <a href="./index.html" class="text-decoration-none text-secondary custom-link">Home</a>
                    <a href="./rolunk.html" class="text-decoration-none text-secondary custom-link">About</a>
                    <a href="./kapcsolat.html" class="text-decoration-none text-secondary custom-link">Contact</a>
                </div>

                <div class="col-12 col-md-3 d-flex flex-column gap-2">
                    <h5 class="fw-bold text-white mb-3">Services</h5>
                    <a href="#" class="text-decoration-none text-secondary custom-link">For Partners</a>
                    <a href="#" class="text-decoration-none text-secondary custom-link">System Status</a>
                </div>

                <div class="col-12 col-md-3 d-flex flex-column gap-2">
                    <h5 class="fw-bold text-white mb-3">Legal</h5>
                    <a href="#" class="text-decoration-none text-secondary custom-link">Gift Card</a>
                    <a href="#" class="text-decoration-none text-secondary custom-link">Privacy</a>
                    <a href="#" class="text-decoration-none text-secondary custom-link">Terms of Use</a>
                </div>

            </div>
        </div>
    </footer>

    <script src="./scripts/Night-Out Reserve.js"></script>
    <script src="./scripts/nav.js"></script>       
    <script src="./scripts/helyszinek.js"></script>
    <script src="./scripts/cookie-consent.js"></script>

</body>
