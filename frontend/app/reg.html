<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
   
    <link rel="stylesheet" href="reg.css">
    <link rel="stylesheet" href="./styles/reg.css">
</head>

<body>

    
<div class="logo">
            <div class="logo-icon">
                <a href="./index.html">

                    <i class="fa-regular fa-calendar-check"></i>
                </a>
            </div>
            <span>Night-Out Reserve</span>
        </div>
        
    
    <form method="POST" onsubmit="handleRegistration(event)">

        <h2>Registration</h2>

        <input type="text" id="username" placeholder="Username (minimum 4 characters)">
        <div class="error" id="userError"></div>

        <input type="password" id="password" placeholder="Password (minimum 8 characters)">
        <div class="error" id="passError"></div>

        <input type="password" id="password2" placeholder="Confirm password">
        <div class="error" id="pass2Error"></div>

        <input type="text" id="email" placeholder="Email (name@gmail.com)">
        <div class="error" id="emailError"></div>

        <input type="text" id="phone" placeholder="Phone number (06 30 123 4567)">
        <div class="error" id="phoneError"></div>

        <div class="reg-gdpr-container" style="margin-bottom: 20px; display: flex; align-items: flex-start; gap: 10px;">
    <input type="checkbox" id="gdpr-agree" style="margin-top: 5px; cursor: pointer;">
    <label for="gdpr-agree" style="font-size: 0.85rem; color: #d1d5db; cursor: pointer; line-height: 1.4;">
        I have read and agree to the 
        <a href="privacy-policy.html" target="_blank" style="color: #8b5cf6; text-decoration: underline;">Privacy Policy</a>.
    </label>
</div>
<div id="gdprError" class="error" style="margin-bottom: 10px;"></div>

 <a href="./login.html" class="forgot-password-link">Already have an account</a>
<button type="submit" class="submit-btn">Register</button>
<p class="success" id="successMsg"></p>
    </form>
    <script src="./scripts/regell.js"></script>
        <script src="./scripts/cookie-consent.js"></script>

</body>
</html>
