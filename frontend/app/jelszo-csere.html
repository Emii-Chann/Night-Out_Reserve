<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jelszó csere</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/reg.css">
</head>

<body>
    <div class="logo">
        <div class="logo-icon">
            <a href="./index.html">
                <i class="fa-regular fa-calendar-check"></i>
            </a>
        </div>
        <span>Night-Out Reserve</span>
    </div>

    <form method="POST">
        <h2>Jelszó csere</h2>

        <input type="email" id="email" placeholder="Email cím">

        <input type="password" id="newPassword" placeholder="Új jelszó">

        <input type="password" id="confirmPassword" placeholder="Új jelszó megerősítése">

        <button type="submit">Jelszó módosítása</button>
    </form>
</body>
</html>
