<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password reset</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/reg.css">

</head>

<body>
    <div class="logo">
        <div class="logo-icon">
            <a href="./index.html">
                <i class="fa-regular fa-calendar-check"></i>
            </a>
        </div>
        <span>Night-Out Reserve</span>
    </div>

    <form method="POST">
        <h2>Password reset</h2>

        <input type="email" id="email" placeholder="Email address">

        <input type="password" id="newPassword" placeholder="New password">

        <input type="password" id="confirmPassword" placeholder="Confirm new password">

        <button type="button" onclick="updatePassword()" class="te-gomb-osztalyod">
            Update password
        </button>
    </form>
</body>

<script>

    async function updatePassword() {
        // 1. Kiolvassuk az input mezők értékeit (Cseréld le az ID-kat a sajátjaidra!)
        const email = document.getElementById('email').value;
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // 2. Ellenőrzések
        if (!email || !newPassword || !confirmPassword) {
            Swal.fire({
              icon: 'error',
              title: 'Oops...',
              text: "Kérlek, tölts ki minden mezőt!",
              background: '#1e1e2d',
              color: '#fff',
              confirmButtonColor: '#ef4444'
            });
            return;
        }

        if (newPassword !== confirmPassword) {
            Swal.fire({
              icon: 'error',
              title: 'Oops...',
              text: "A megadott jelszavak nem egyeznek!",
              background: '#1e1e2d',
              color: '#fff',
              confirmButtonColor: '#ef4444'
            });
            return;
        }

        // Opcionális: Minimum hossz ellenőrzése
        const jelszoSzabaly = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}$/;
    
         if (!jelszoSzabaly.test(newPassword)) {
        Swal.fire({
          icon: 'error',
          title: 'Oops...',
          text: "Helytelen jelszó! Tartalmaznia kell minimum 1 nagybetűt, 1 kisbetűt és 1 számot!",
          background: '#1e1e2d',
          color: '#fff',
          confirmButtonColor: '#ef4444'
        });
        return; // Itt megállítjuk, el sem küldjük a backendnek
    }

        // 3. Adatok küldése a backendnek
        const adatok = {
            email: email,
            newPassword: newPassword
        };

        try {
            const response = await fetch('http://104.248.22.60:8080/auth/reset-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(adatok)
            });

            if (response.ok) {
                Swal.fire({
                  icon: 'success',
                  title: 'Success!',
                  text: "A jelszavadat sikeresen frissítettük!",
                  background: '#1e1e2d',
                  color: '#fff',
                  confirmButtonColor: '#8b5cf6'
                });
                // Visszairányítjuk a bejelentkezés oldalra
                window.location.href = "login.html";
            } else {
                const hibaSzoveg = await response.text();
                Swal.fire({
                  icon: 'error',
                  title: 'Oops...',
                  text: "Hiba: " + hibaSzoveg,
                  background: '#1e1e2d',
                  color: '#fff',
                  confirmButtonColor: '#ef4444'
                });
            }
        } catch (hiba) {
            console.error("Hiba történt a kommunikáció során:", hiba);
            Swal.fire({
              icon: 'error',
              title: 'Oops...',
              text: "Nem sikerült kapcsolódni a szerverhez.",
              background: '#1e1e2d',
              color: '#fff',
              confirmButtonColor: '#ef4444'
            });
        }
    }
</script>

</html>
