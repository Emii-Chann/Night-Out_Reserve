<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password reset</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/reg.css">

</head>

<body>
    <div class="logo">
        <div class="logo-icon">
            <a href="./index.html">
                <i class="fa-regular fa-calendar-check"></i>
            </a>
        </div>
        <span>Night-Out Reserve</span>
    </div>

    <form method="POST">
        <h2>Password reset</h2>

        <input type="email" id="email" placeholder="Email address">

        <input type="password" id="newPassword" placeholder="New password">

        <input type="password" id="confirmPassword" placeholder="Confirm new password">

        <button type="button" onclick="updatePassword()" class="te-gomb-osztalyod">
            Update password
        </button>
    </form>
</body>

<script>

    async function updatePassword() {
    // Kiolvassuk a tokent az URL-ből (pl. ?token=abc-123)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
        alert("A jelszavak nem egyeznek!");
        return;
    }

    const adatok = {
        token: token,
        newPassword: newPassword
    };

    // Küldés a backendnek (most már a domain neveddel!)
    const response = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(adatok)
    });

    if (response.ok) {
        alert("Sikeres jelszócsere!");
        window.location.href = "login.html";
    }
}
</script>

</html>
