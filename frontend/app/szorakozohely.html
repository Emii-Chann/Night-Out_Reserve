<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night-Out Reserve</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
</head>
<body>

  <div id="navbar-container"></div>
    <header class="hero">
        <div class="hero-content">
            <h1>Te éjszakád, <span class="text-purple">Te utad</span></h1>
            <p>Foglalj exkluzív helyszíneket, VIP asztalokat és prémium játékokat a tökéletes éjszakai életért</p>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="">
                <button class="search-btn">Keresés</button>
            </div>

            <div class="category-tabs">
                <a href="#" class="tab active">Szórakozóhelyek</a>
                <a href="./asztalok.html" class="tab">Asztalok</a>
                <a href="./jatekok.html" class="tab">Játékok</a>
            </div>
        </div>
    </header>

    <div id="hely-helyszinek-lista"></div>

    <div id="hely-foglalas-modal" style="display: none;" class="modal">
    <div class="modal-tartalom">
        <h2 id="hely-modal-cim">Helyszín foglalása</h2>
        
        <form id="hely-foglalas-form">
            <label>Dátum</label>
            <input type="date" id="hely-datum" required>

            <label>Érkezés időpontja</label>
            <select id="hely-ido" required> </select>

            <label>Időtartam (óra)</label>
            <input type="number" id="hely-idotartam" value="2" min="1" required>

            <label>Létszám (fő)</label>
            <input type="number" id="hely-letszam" value="2" min="1" required>

            <label>Megjegyzés (pl. szülinap, egyedi kérés)</label>
            <textarea id="hely-megjegyzes" rows="3" placeholder="Opcionális..."></textarea>

            <input type="hidden" id="hely-szorakozohely-id">

            <button type="button" onclick="helyFoglalasBekuldese()">Foglalás elküldése</button>
            <button type="button" onclick="helyModalBezarasa()">Mégsem</button>
        </form>
    </div>
</div>

</footer>
    <script src="./scripts/Night-Out Reserve.js"></script>
<script src="./scripts/helyfoglalas.js"></script>
    <script src="./scripts/nav.js"></script>       
    <script src="./scripts/helyfoglalas_helyszinek .js"></script>
</body>
</html>
