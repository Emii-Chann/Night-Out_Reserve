<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <meta charset="UTF-8">
    <title>Admin - Managing Locations</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="./styles/Night-Out Reserve.css">
    <link rel="stylesheet" href="./styles/admin.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon"><i class="fa-regular fa-calendar-check"></i></div>
            <h2>Night-Out Reserve</h2>
        </div>
        <nav class="sidebar-nav">
            <select id="venueSelector" class="admin-venue-select mb-3 ms-4 me-4 w-75 p-2 rounded border-0"></select>
            <a href="admin-dashboard.html" id="nav-dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="admin-helyszinek.html" id="nav-helyszinek" class="active"><i class="fa-solid fa-location-dot"></i> Locations</a>
            <a href="./set-password.html" class="nav-profile-link"><i class="fa fa-repeat"></i> Change Password</a>
            <a href="./admin-eszkozok.html" class="nav-profile-link"><i class="fa fa-gamepad"></i> Tables & Games</a>
            <a href="./admin-profil.html" class="nav-profile-link"><i class="fa fa-user"></i> Profile</a>
        </nav>
        <div class="sidebar-footer">
            <button onclick="kijelentkezes()" class="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </div>

    <main class="admin-container p-5">
        <div class="admin-header d-flex justify-content-between align-items-center mb-5">
            <h1 class="fw-bold m-0">Managing Venues</h1>
            <button onclick="document.getElementById('ujHelyModal').style.display='block'" class="admin-primary-btn m-0">+ New venue</button>
        </div>

        <div id="admin-helyszin-grid" class="helyszinek-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px;"></div>
    </main>

    <div id="ujHelyModal" class="modal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary p-4">
                <h3 class="text-white border-bottom border-secondary pb-3 mb-4">Add Venue</h3>

                <label class="form-label text-secondary small">Venue name:</label>
                <input type="text" id="uj-nev" class="form-control bg-dark text-white border-secondary mb-3" placeholder="E.g. Neon Bar">

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label text-secondary small">City:</label>
                        <input type="text" id="uj-varos" class="form-control bg-dark text-white border-secondary" placeholder="E.g. Pécs">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small">Exact address:</label>
                        <input type="text" id="uj-cim" class="form-control bg-dark text-white border-secondary" placeholder="E.g. Király utca 12.">
                    </div>
                </div>

                <label class="form-label text-secondary small">Description:</label>
                <textarea id="uj-leiras" rows="3" class="form-control bg-dark text-white border-secondary mb-3" placeholder="Short description of the place..."></textarea>

                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <label class="form-label text-secondary small">Opening hours:</label>
                        <input type="text" id="uj-nyitvatartas" class="form-control bg-dark text-white border-secondary" placeholder="E.g. 18:00 - 02:00">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small">Number of tables:</label>
                        <input type="number" id="uj-asztalszam" class="form-control bg-dark text-white border-secondary" placeholder="E.g. 15">
                    </div>
                </div>

                <label class="form-label text-secondary small">Venue image:</label>
                <input type="file" id="uj-kep" accept="image/*" class="form-control bg-dark text-white border-secondary mb-2">
                <div id="kep-preview" class="rounded w-100 mb-4" style="height: 120px; background-size: cover; display: none;"></div>

                <div class="d-flex gap-2">
                    <button onclick="document.getElementById('ujHelyModal').style.display='none'" class="btn btn-outline-light w-50">Cancel</button>
                    <button onclick="mentesUjHely()" class="admin-primary-btn m-0 w-50">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="ujEszkozModal" class="modal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary p-4">
                <h3 class="text-white border-bottom border-secondary pb-3 mb-4">Add Equipment<br><small id="aktualisHelyNev" class="text-success fs-6"></small></h3>

                <label class="form-label text-secondary small">Type:</label>
                <select id="eszkozTipus" onchange="valtsEszkozMezoket()" class="form-select bg-dark text-white border-secondary mb-4">
                    <option value="asztal">Table</option>
                    <option value="jatek">Game (Billiards, Darts, etc.)</option>
                </select>

                <div id="asztalMezok">
                    <label class="form-label text-secondary small">Table number/name:</label>
                    <input type="text" id="asztalSzam" class="form-control bg-dark text-white border-secondary mb-3">

                    <label class="form-label text-secondary small">Capacity (persons):</label>
                    <input type="number" id="asztalFerohely" class="form-control bg-dark text-white border-secondary mb-4">
                </div>

                <div id="jatekMezok" style="display: none;">
                    <label class="form-label text-secondary small">Game name:</label>
                    <input type="text" id="jatekNev" class="form-control bg-dark text-white border-secondary mb-3">

                    <label class="form-label text-secondary small">Description (E.g. 9-foot, pro):</label>
                    <input type="text" id="jatekLeiras" class="form-control bg-dark text-white border-secondary mb-3">

                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <label class="form-label text-secondary small">Quantity:</label>
                            <input type="number" id="jatekDarab" value="1" class="form-control bg-dark text-white border-secondary">
                        </div>
                        <div class="col-6">
                            <label class="form-label text-secondary small">Price/hour (HUF):</label>
                            <input type="number" id="jatekAr" class="form-control bg-dark text-white border-secondary">
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button onclick="document.getElementById('ujEszkozModal').style.display='none'" class="btn btn-outline-light w-50">Cancel</button>
                    <button onclick="mentesUjEszkoz()" class="admin-primary-btn m-0 w-50">Add</button>
                </div>
            </div>
        </div>
    </div>

    <div id="szerkesztHelyszinModal" class="modal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary p-4">
                <h3 class="text-white border-bottom border-secondary pb-3 mb-4">Edit Venue</h3>

                <input type="hidden" id="edit-id"> 
                
                <label class="form-label text-secondary small">Name:</label>
                <input type="text" id="edit-nev" class="form-control bg-dark text-white border-secondary mb-3">

                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label text-secondary small">City:</label>
                        <input type="text" id="edit-varos" class="form-control bg-dark text-white border-secondary">
                    </div>
                    <div class="col-6">
                        <label class="form-label text-secondary small">Address:</label>
                        <input type="text" id="edit-cim" class="form-control bg-dark text-white border-secondary">
                    </div>
                </div>

                <label class="form-label text-secondary small">Opening hours:</label>
                <input type="text" id="edit-nyitvatartas" class="form-control bg-dark text-white border-secondary mb-3">

                <label class="form-label text-secondary small">Description:</label>
                <textarea id="edit-leiras" rows="3" class="form-control bg-dark text-white border-secondary mb-3"></textarea>

                <label class="form-label text-secondary small">Venue image:</label>
                <input type="file" id="edit-kep" accept="image/*" class="form-control bg-dark text-white border-secondary mb-2">
                <div id="kep-preview" class="rounded w-100 mb-4" style="height: 120px; background-size: cover; display: none;"></div>

                <div class="d-flex gap-2">
                    <button onclick="document.getElementById('szerkesztHelyszinModal').style.display='none'" class="btn btn-outline-light w-50">Cancel</button>
                    <button onclick="mentesModositas()" class="admin-primary-btn m-0 w-50">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./scripts/nav.js"></script>
    <script src="./scripts/admin-helyszinek.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
